<!-- FILTRO POR INSTÂNCIA -->
<!-- FILTRO POR INSTÂNCIA VIA PESQUISA -->
<div class="filtro-instancia">
  <label>Buscar por instância:</label>
  <input 
    type="text"
    placeholder="Digite a instância (ex: t3)"
    [(ngModel)]="instanciaSelecionada"
    (input)="buscarContatos()"
  />
</div>


<!-- Lista de contatos -->
<div *ngIf="contatos.length > 0" class="contatos-lista">
  <h3>Contatos</h3>
  <ul>
    <li *ngFor="let c of contatos">
      {{ c.nome }} - {{ c.numero }}
    </li>
  </ul>
</div>

<!-- Mensagem quando não houver contatos -->
<div *ngIf="contatos.length === 0">
  <p>Nenhum contato encontrado.</p>
</div>
